<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin-Dashboard</title>
    <link rel="stylesheet" href="style.css" />
    <!-- <link rel="stylesheet" href="admin.css" /> -->
    <script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"
        onerror="var s=document.createElement('script'); s.src='lib/msal-browser.min.js'; document.head.appendChild(s);"
        defer></script>
    <script type="module" src="script.js" defer></script>
</head>

<body class="dashboard-page">
    <header class="site-header">
        <div class="site-header__content">
            <img src="https://metasysusa.com/images/logo.svg" alt="Metasys USA Logo" class="site-logo" />
            <div class="profile-menu">
                <button id="gear-btn" class="gear-btn">
                    <img src="images/GearBoxImage.png" alt="Settings" class="gear-icon" />
                </button>
                <div id="profile-dropdown" class="profile-dropdown-content">
                    <span class="close-btn">&times;</span>
                    <div class="profile-header">
                        <div class="profile-avatar">M</div>
                        <p>Hi, <span id="profile-name">Member</span>!</p>
                    </div>
                    <a href="Manage-Account.html" class="manage-account-btn">Manage your Account</a>
                    <a href="login.html" class="logout-link">
                        <button class="btn--logout">Logout</button>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <div class="dashboard-layout">
        <nav class="site-nav">
            <ul>
                <li>
                    <div class="nav-item__header">
                        <span>About</span>
                        <button class="nav-item__dropdown-btn">&#9660;</button>
                    </div>
                    <div class="nav-item__dropdown">
                        <a href="https://metasysusa.com/index.html" target="_blank" rel="noopener">Our Story</a>
                        <a href="#">Mission & Vision</a>
                        <a href="#">Team</a>
                    </div>
                </li>
                <li>
                    <div class="nav-item__header">
                        <span>Services</span>
                        <button class="nav-item__dropdown-btn">&#9660;</button>
                    </div>
                    <div class="nav-item__dropdown">
                        <a href="https://metasysusa.com/service.html" target="_blank" rel="noopener">It Staffing</a>
                        <a href="#">IT Implementation</a>
                        <a href="#">Consultation</a>
                    </div>
                </li>
                <li>
                    <div class="nav-item__header">
                        <span>Join Us</span>
                        <button class="nav-item__dropdown-btn">&#9660;</button>
                    </div>
                    <div class="nav-item__dropdown">
                        <a href="https://metasysusa.com/join-us.html" target="_blank" rel="noopener">Career
                            Opportunities</a>
                        <a href="#">Open Positions</a>
                        <a href="#">Apply Now</a>
                    </div>
                </li>
            </ul>
        </nav>
        <main>
            <div class="search-bar-container">
                <input type="text" placeholder="Search..." class="search-input" />
                <button class="btn--search">search</button>
            </div>

            <div class="table-wrap">
                <div id="users-table-container"></div>
            </div>

            <div id="pagination-container" class="pagination-container"></div>
        </main>
    </div>

    <footer>
        <span>6 Kacey Ct, Mechanicsburg, PA, USA, 17055</span>
        <a href="https://metasysusa.com/" class="footer-contact" target="_blank" rel="noopener">Contact Us</a>
    </footer>
</body>

</html>
