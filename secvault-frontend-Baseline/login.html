<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetasysUSA - Login Page</title>
    <link rel="stylesheet" href="style.css">


    <script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"
        onerror="var s=document.createElement('script'); s.src='lib/msal-browser.min.js'; document.head.appendChild(s);"
        defer>
        </script>

    <script type="module" src="script.js" defer></script>
</head>

<body class="login-body">
    <div id="signinOverlay" class="overlay hide" style="display:none">Signing you in…</div>
    <div class="login-page-content">
        <div class="intro-section">
            <h1 class="logo-text">METASYS USA</h1>
            <h2 class="tagline">The Professional IT Staffing</h2>
        </div>

        <div class="login-container">
            <form id="loginForm" novalidate>
                <input id="username" class="field" type="text" placeholder="Username" autocomplete="username">
                <input id="password" class="field" type="password" placeholder="Password"
                    autocomplete="current-password">

                <button class="login-button" type="submit">Login</button>

                <a href="#" class="forgot-password-link">Forgot password?</a>
                <div class="divider"></div>

                <button id="ms-login" type="button" class="login-button">Login with Microsoft</button>

                <br>
                <button type="button" class="create-account-button">Create new account</button>
            </form>
        </div>
    </div>

    <div id="alertWindow" class="alert" role="dialog" aria-modal="true" aria-labelledby="alertTitle">
        <div class="alert-content">
            <button type="button" class="close-btn" aria-label="Close">&times;</button>
            <p id="errorMessage">Something went wrong</p>
            <button id="okBtn" type="button" class="alert-ok-btn">OK</button>
        </div>
    </div>
</body>

</html>
