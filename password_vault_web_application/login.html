<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MetasysUSA - Login Page</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="login-body">
    <div class="login-page-content">
      <div class="intro-section">
        <h1 class="logo-text">METASYS USA</h1>
        <h2 class="tagline">The Professional IT Staffing</h2>
      </div>
      <div class="login-container">
        <form id="loginForm">
          <input class="field" type="text" id="username" placeholder="Username" required />
          <input class="field" type="password" id="password" placeholder="Password" required />
          <button class="login-button" type="submit">Login</button>
        </form>
        <a href="#" class="forgot-password-link">Forgot password?</a>
        <div class="divider"></div>
        <button class="create-account-button">Create new account</button>
      </div>
    </div>
    
    <!-- for error messages -->
    <div id="alertWindow" class="alert">
      <div class="alert-content">
        <span class="close-btn">&times;</span>
        <p id="errorMessage"></p>
        <button id="okBtn" class="alert-ok-btn">OK</button>
      </div>
    </div>

    <div class="new">
      
      
    </div>

    <script src="script.js"></script>
  </body>
</html>
